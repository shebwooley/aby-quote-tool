<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ABY Benefits - Setup questions</title>
<style>
  :root { --blue: #205aa6; --blue-dark: #143c73; --ink: #12263f; --muted: #3f4b56; --line: #c9d4de; --soft: #eef3f8; --ok: #1a5c3a; --warn: #8a4b00; --bad: #b3261e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f6f9; color: var(--ink); font: 16px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 80px; }
  header.top { display: flex; align-items: center; gap: 18px; background: #fff; border-bottom: 3px solid var(--blue-dark); padding: 14px 20px; }
  header.top img { height: 44px; }
  header.top .who { font-size: 15px; color: var(--muted); }
  header.top .who strong { color: var(--ink); }
  h1 { font-size: 26px; margin: 8px 0 6px; color: var(--blue-dark); }
  .lead { font-size: 16px; color: var(--muted); margin: 0 0 18px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; margin-bottom: 18px; }
  .steps { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; padding: 0; list-style: none; }
  .steps button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .steps button.on { background: var(--blue-dark); color: #fff; border-color: var(--blue-dark); }
  .steps button .n { opacity: .8; margin-left: 6px; font-size: 13px; }
  h2 { font-size: 21px; margin: 0 0 4px; color: var(--blue-dark); }
  .intro { color: var(--muted); margin: 0 0 18px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px 18px; }
  .q { grid-column: span 6; display: flex; flex-direction: column; }
  .q.half { grid-column: span 3; justify-content: flex-end; }
  .q.third { grid-column: span 2; justify-content: flex-end; }
  .q.head { margin-top: 10px; padding-top: 14px; border-top: 1px solid var(--soft); }
  .q > label, .q > .lbl { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
  .q .hint { font-size: 14px; color: var(--muted); margin: -2px 0 8px; }
  .why { margin: -2px 0 8px; font-size: 14px; color: var(--muted); }
  .why summary { cursor: pointer; color: var(--blue); font-weight: 600; }
  .why div { margin-top: 6px; padding: 10px 12px; background: var(--soft); border-radius: 8px; color: var(--ink); }
  .q .tag { display: inline-block; font-size: 12px; font-weight: 600; color: var(--blue-dark); background: var(--soft); border-radius: 6px; padding: 1px 7px; margin-left: 8px; vertical-align: 1px; }
  input[type=text], input[type=email], input[type=tel], input[type=date], input[type=number], select, textarea {
    font: inherit; font-size: 16px; color: var(--ink); width: 100%; padding: 10px 12px; border: 1px solid #aebdcb; border-radius: 8px; background: #fff; }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid rgba(32,90,166,.35); border-color: var(--blue); }
  input[readonly], textarea[readonly], select[disabled] { background: #f6f8fa; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px 18px; }
  .opts label { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; cursor: pointer; }
  .opts input { width: 18px; height: 18px; margin: 0; }
  .list input + input { margin-top: 8px; }
  .nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
  .btn { font: inherit; font-size: 16px; font-weight: 600; border-radius: 8px; padding: 10px 20px; cursor: pointer; border: 1px solid var(--blue-dark); background: var(--blue-dark); color: #fff; }
  .btn.ghost { background: #fff; color: var(--blue-dark); }
  .btn[disabled] { opacity: .55; cursor: default; }
  .saved { font-size: 14px; color: var(--muted); }
  .saved.err { color: var(--bad); font-weight: 600; }
  .note { border-radius: 10px; padding: 14px 16px; font-size: 15px; margin-bottom: 16px; }
  .note.info { background: var(--soft); border: 1px solid #c8d6e6; }
  .note.ok { background: #f1f8f3; border: 1px solid #b9dcc4; color: var(--ok); }
  .note.warn { background: #fff7ec; border: 1px solid #f0cf9c; color: var(--warn); }
  .note.bad { background: #fdf0ef; border: 1px solid #f0b9b4; color: var(--bad); }
  .note ul { margin: 6px 0 0 20px; padding: 0; }
  .review-sec { margin-bottom: 14px; }
  .review-sec a { color: var(--blue); cursor: pointer; text-decoration: underline; }
  .download { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
  .download a { color: var(--blue); font-weight: 600; }
  /* PRINTING (Eric, 09-29-2026: printed quotes "definitely look funny" with drop-downs). The screen
     is a step-by-step form; paper gets a plain list of every question and its answer instead. */
  #printview { display: none; }
  /* Read-only answers in words, dark and full size (10-06-2026: a grayed-out tick read as blank to ABY's processor). */
  .share .share-row { display: flex; gap: 8px; margin-top: 8px; }
  .share .share-row input { flex: 1; font-size: 15px; color: #111; background: #fff; padding: 8px 10px; border: 1px solid #9aa5b1; border-radius: 6px; }
  .ro-ans { font-size: 16px; font-weight: 600; color: #111; padding: 4px 0 2px; }
  .ro-ans.blank { font-weight: 400; font-style: italic; color: #4b5563; }
  .sheet .pv-row { font-size: 15px; color: #111; }
  .sheet .pv-row .a.blank { color: #4b5563; }
  .sheet .pv-sec h3 { font-size: 18px; }
  .pv-sec { margin: 0 0 14px; break-inside: auto; }
  .pv-sec h3 { font-size: 15pt; color: var(--blue-dark); border-bottom: 1.5px solid var(--blue-dark); margin: 14px 0 6px; padding-bottom: 3px; }
  .pv-row { display: grid; grid-template-columns: 45% 55%; gap: 10px; padding: 4px 0; border-bottom: 1px solid #dde3e9; font-size: 10.5pt; break-inside: avoid; }
  .pv-row .a { font-weight: 600; }
  .pv-row .a.blank { font-weight: 400; color: #666; font-style: italic; }
  @media print {
    @page { margin: 0.6in; }
    body { background: #fff; }
    #app { display: none; }
    #printview { display: block; }
    .wrap { padding: 0; max-width: none; }
    header.top { border-bottom-width: 2px; padding: 0 0 8px; }
  }
  @media (max-width: 680px) { .q.half, .q.third { grid-column: span 6; } .card { padding: 18px 16px; } }
</style>
</head>
<body>
<header class="top">
  <img src="/assets/images/aby-logo.png" alt="ABY Benefits">
  <div class="who" id="who"></div>
</header>
<div class="wrap">
  <div id="app"><p class="lead">Loading...</p></div>
  <div id="printview"></div>
</div>
<script src="/assets/js/data/application-questions.js?v=20261001b"></script>
<script src="/assets/js/apply.js?v=20261001b"></script>
</body>
</html>
